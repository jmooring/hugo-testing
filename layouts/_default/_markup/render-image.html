{{- $img := .Page.Resources.GetMatch (.Destination | safeURL) -}}
{{- if $img -}}
  {{- $resized := $img.Process "webp q75" -}}
  <img src="{{ $resized.RelPermalink }}" alt="{{ .Text }}" {{ with .Title }} title="{{ . }}"{{ end }}>
{{- else -}}
  <img src="{{ .Destination | safeURL }}" alt="{{ .Text }}" {{ with .Title }} title="{{ . }}"{{ end }}>
{{- end -}}
