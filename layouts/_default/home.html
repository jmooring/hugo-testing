{{ define "main" }}
  {{ with .Params.details }}
    <p>Details: <a href="{{ . }}">{{ . }}</a></p>
  {{ end }}
  {{ with .Params.description }}
    <p>Description: {{ . }}</p>
  {{ end }}
  {{ with or .Params.url .Params.details }}
    <hr>
  {{ end }}
  {{ .Content }}

  <span class="icon-text">
    <span class="icon">
      <i class="fa-solid fa-envelope"></i>
    </span>
    <span>My email</span>
  </span>

{{ end }}
