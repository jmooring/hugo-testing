{{ define "main" }}
  <h1>{{ .Title }}</h1>

  {{ with .Prev }}
    <a href="{{ .RelPermalink }}">Previous</a>
  {{ end }}
  {{ with .Next }}
    <a href="{{ .RelPermalink }}">Next</a>
  {{ end }}

  {{ transform.Highlight (strings.TrimSpace .RawContent) "text" }}

  {{ partial "toc.html" . }}
  {{ .Content }}
{{ end }}
