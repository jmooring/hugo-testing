{{ define "main" }}
  <h1>{{ .Title }}</h1>
  {{ .Content }}


  {{ with .GetTerms "categories" }}
    <p>categories:
      {{ range . }}
        <a href="{{ .RelPermalink }}">{{ .LinkTitle }}</a>
      {{ end }}
    </p>
  {{ end }}

  {{ with site.RegularPages.Related . }}
    <p>Related content:</p>
    <ul>
      {{ range . }}
        <li><a href="{{ .RelPermalink }}">{{ .LinkTitle }}</a></li>
      {{ end }}
    </ul>
  {{ end }}

{{ end }}
