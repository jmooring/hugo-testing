{{ define "main" }}
  <article>
    <header class="mb-12">
      <h1 class="text-4xl md:text-5xl font-black tracking-tighter text-slate-900 mb-4 leading-tight">
        {{ .Title }}
      </h1>

      {{ with .Params.description }}
        <p class="text-xl md:text-2xl text-slate-500 font-medium leading-relaxed max-w-3xl mb-8">
          {{ . }}
        </p>
      {{ end }}

      {{ with .GetTerms "tags" }}
        <div class="not-prose pt-6 border-t border-slate-200 flex items-center gap-4">
          <span class="text-xs font-bold uppercase tracking-widest text-slate-400 whitespace-nowrap">
            Filed Under
          </span>
          <div class="flex flex-wrap gap-2">
            {{ range . }}
              <a href="{{ .RelPermalink }}"
                 class="inline-block px-3 py-1 rounded-md bg-slate-100 text-slate-600 text-sm font-semibold hover:bg-blue-600 hover:text-white transition-all duration-200">
                #{{ .LinkTitle }}
              </a>
            {{ end }}
          </div>
        </div>
      {{ end }}
    </header>

    <div class="page-content mb-16">
      {{ .Content }}
    </div>

  </article>
{{ end }}
