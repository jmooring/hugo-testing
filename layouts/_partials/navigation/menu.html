{{ with site.Menus.main }}
  <nav class="mt-4" aria-label="Main Navigation">
    <ul class="flex flex-wrap items-center gap-x-6 gap-y-2 list-none p-0 m-0">
      {{ range . }}
        {{ $active := or ($.IsMenuCurrent .Menu .) ($.HasMenuCurrent .Menu .) }}
        <li>
          <a href="{{ .URL }}"
             {{ if $.IsMenuCurrent .Menu . }}aria-current="page"{{ end }}
             class="text-sm transition-colors {{ if $active }}text-blue-600 font-bold{{ else }}text-slate-500 hover:text-slate-900 font-medium{{ end }}">
            {{ .Name }}
          </a>
        </li>
      {{ end }}
    </ul>
  </nav>
{{ end }}
