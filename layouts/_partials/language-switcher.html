{{ with .Rotate "language" }}
	<nav class="nav-inline language-switcher">
		<ul>
			{{ range . }}
				{{ if eq .Site.Language $.Site.Language }}
					<li class="active"><a aria-current="page" href="{{ .Permalink }}">{{ .Site.Language.Label }}</a></li>
				{{ else }}
					<li><a href="{{ .Permalink }}" hreflang="{{ .Site.Language.Locale }}">{{ .Site.Language.Label }}</a></li>
				{{ end }}
			{{ end }}
		</ul>
	</nav>
{{ end }}
