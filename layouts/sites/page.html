{{ define "main" }}
  <h1>{{ .Title }}</h1>
  {{ .Content }}

  {{ range $k, $v := .Params }}
    {{ if and (ne $k "images") $v }}
      <p><strong>{{ $k | title }}:</strong> {{ $v }}</p>
    {{ end }}
  {{ end }}

  {{ partial "render-images.html" (dict "page" . "processingSpec" "resize 400x") }}
{{ end }}
