{{ define "main" }}
  <h1>{{ .Title }}</h1>
  {{ .Content }}
  {{ range (.Paginate .Pages).Pages }}
    <h2><a href="{{ .RelPermalink }}">{{ .LinkTitle }}</a></h2>
    <div>
      {{ partial "render-images.html" (dict "page" . "processingSpec" "fill 100x100") }}
    </div>
  {{ end }}
  <nav class="nav-inline pagination">
    {{ partial "pagination.html" . }}
  </nav>
{{ end }}
