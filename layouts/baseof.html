<!DOCTYPE html>
<html lang="{{ site.Language.Locale }}" dir="{{ or site.Language.Direction `ltr` }}">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, minimum-scale=1.0, initial-scale=1.0">
		<title>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ printf "%s | %s" .Title site.Title }}{{ end }}</title>
		{{ $noop := .WordCount }}
		{{ if .Page.Store.Get "hasMath" }}
			{{/*  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.21/dist/katex.min.css">  */}}
			<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.18.4/dist/katex.min.css">
		{{ end }}
	</head>
	<body>
		<header>
			<div class="site-title"><a href="{{ site.Home.RelPermalink }}">{{ site.Title }}</a></div>
			<hr>
		</header>
		<main>
			{{ block "main" . }}{{ end }}
		</main>
	</body>
</html>
