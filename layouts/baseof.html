<!DOCTYPE html>
<html lang="{{ site.Language.LanguageCode }}" dir="{{ or site.Language.LanguageDirection `ltr` }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, minimum-scale=1.0, initial-scale=1.0">
  <title>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ printf "%s | %s" .Title site.Title }}{{ end }}</title>
  <style>
    /* Base */
    /* ------------------------------------------------------------------------- */

    html {
      box-sizing: border-box;
      font-family: sans-serif;
      font-size: 16px;
      line-height: 1.5;
      scroll-behavior: smooth;
    }

    body {
      margin: 1rem;
      max-width: 768px;
    }

    a {
      color: blue;
      text-decoration: none;
    }

    img {
      height: auto;
      max-width: 100%
    }

    /* Navigation */
    /* ------------------------------------------------------------------------- */

    .nav-inline ol,
    .nav-inline ul {
      margin: 1rem 0;
      padding: 0;
    }

    .nav-inline li {
      display: inline;
      padding-right: 1rem;
    }

    .nav-inline li:last-of-type {
      padding-right: 0;
    }

    .nav-inline li.active a {
      background-color: yellow;
    }

    .nav-inline li.ancestor a {
      background-color: cyan;
    }

    .nav-inline.breadcrumbs li:not(:last-child)::after {
      content: "\00bb";
    }

    /* Code blocks */
    /* ------------------------------------------------------------------------- */

    /* Applies when there are no line numbers, or when line numbers are inline. */
    .highlight > pre {
      padding: 1em 0 1em 1em;
    }

    /* Applies when line numbers are in a table cell. */
    .highlight div {
      padding: 0 0 0 1em;
    }

    /* Applies to all. */
    .highlight div,
    .highlight > pre {
      overflow-x: auto;
      /* add border-radius and box-shadow here */
    }

    /* Applies when using an external style sheet. */
    /* https://github.com/alecthomas/chroma/issues/722 */
    .highlight .chroma .lntable .lnt,
    .highlight .chroma .lntable .hl {
      display: flex;
    }

    /* Applies when using an external style sheet. */
    /* https://github.com/alecthomas/chroma/issues/722 */
    .highlight .chroma .lntable .lntd + .lntd {
      width: 100%;
    }
  </style>
</head>
<body>
  <header>
    <h1><a href="{{ site.Home.RelPermalink }}">{{ site.Title }}</a></h1>
    <hr>
  </header>
  <main>
    {{ block "main" . }}{{ end }}
  </main>
</body>
</html>
