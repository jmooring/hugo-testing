{{ define "main" }}
	<h1>{{ .Title }}</h1>
	{{ .Content }}
	{{ with site.RegularPages.Related . }}
		<p>Related content:</p>
		<ul>
			{{ range . }}
				<li><a href="{{ .RelPermalink }}">{{ .LinkTitle }}</a></li>
			{{ end }}
		</ul>
	{{ end }}
	{{ range .Pages }}
		<h2><a href="{{ .RelPermalink }}">{{ .LinkTitle }}</a></h2>
	{{ end }}
{{ end }}
