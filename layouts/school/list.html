{{ define "main" }}
  <h1>{{ .Title }}</h1>
  {{ .Content }}

  {{ with .GetTerms "locations" }}
    <p>Location:
      {{ range . }}
        <a href="{{ .RelPermalink }}">{{ .LinkTitle }}</a>
      {{ end }}
    </p>
  {{ end }}

  {{ range .Pages }}
    <h2><a href="{{ .RelPermalink }}">{{ .LinkTitle }}</a></h2>
  {{ end }}
{{ end }}
