{{ define "main" }}
  <h1>{{ .Title }}</h1>
  {{ .Content }}

  {{ $taxonomyObject := .Data.Terms }}

  {{ range $taxonomyObject.ByCount }}
  <h2><a href="{{ .Page.RelPermalink }}">{{ .Page.LinkTitle }}</a> ({{ .Count }})</h2>
  <ul>
    {{ range .Pages.ByTitle }}
      <li><a href="{{ .RelPermalink }}">{{ .Title }}</a></li>
    {{ end }}
  </ul>
{{ end }}



{{ end }}
