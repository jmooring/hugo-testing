baseURL      = 'https://example.org/'
locale = 'en-us'
title        = 'Hugo Forum Topic #37345'

disableKinds = ['page', 'rss', 'section', 'sitemap', 'taxonomy', 'term']

[module.hugoVersion]
  min = '0.163.0'

# Default mounts
[[module.mounts]]
  source = 'assets'
  target = 'assets'

[[module.mounts]]
  source = 'static'
  target = 'static'

# Mount static to assets
[[module.mounts]]
  source = "static/css"
  target = "assets/css"
