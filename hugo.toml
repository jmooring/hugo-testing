baseURL                        = 'https://example.org/'
enableGitInfo                  = true
defaultContentLanguage         = 'en'
defaultContentLanguageInSubdir = true

# -----------------------------------------------------------------------------
# Languages
# -----------------------------------------------------------------------------

[languages.en]
  locale    = 'en-US'
  direction = 'ltr'
  label     = 'English'
  weight    = 1
  title     = 'Hugo Forum Topic #7660 (en)'

[languages.de]
  locale    = 'de-DE'
  direction = 'ltr'
  label     = 'Deutsch'
  weight    = 2
  title     = 'Hugo Forum Topic #7660 (de)'

# -----------------------------------------------------------------------------
# Menus
# -----------------------------------------------------------------------------

  [[languages.en.menus.main]]
    name    = 'Home (en)'
    pageRef = '/'
    weight  = 10

  [[languages.en.menus.main]]
    name    = 'Posts (en)'
    pageRef = '/posts'
    weight  = 20

  [[languages.de.menus.main]]
    name    = 'Home (de)'
    pageRef = '/'
    weight  = 10

  [[languages.de.menus.main]]
    name    = 'Posts (de)'
    pageRef = '/posts'
    weight  = 20

# -----------------------------------------------------------------------------
# Module
# -----------------------------------------------------------------------------

[module.hugoVersion]
  min = '0.163.0'

[[module.imports]]
  path = 'github.com/jmooring/hugo-module-debug'

# -----------------------------------------------------------------------------
# Params
# -----------------------------------------------------------------------------

[params]
  foo = 'bar'
  baz = 'qux'
