disableKinds = ['home','rss','section','sitemap','taxonomy','term']
printPathWarnings = true

defaultContentLanguage = 'en'
defaultContentLanguageInSubdir = true

[languages.en]
direction = 'ltr'
label = 'English'
locale = 'en-US'
weight = 1

[languages.es]
direction = 'ltr'
label = 'Español'
locale = 'es-ES'
weight = 2

[[module.mounts]]
source = "content/en"
target = "content"
[module.mounts.sites.matrix]
languages = "**"

[[module.mounts]]
source = "content/es"
target = "content"
[module.mounts.sites.matrix]
languages = ["es"]
