baseURL = 'https://example.org/'
languageCode = 'en-US'
title = 'Hugo GitHub Issue #448'
summaryLength = 10

# -----------------------------------------------------------------------------
# Cascade: do not create RSS feeds for archive pages
# -----------------------------------------------------------------------------

[[cascade]]
outputs = ['html']
[cascade.target]
path = '{/archive,/archive/**}'

# -----------------------------------------------------------------------------
# Menus
# -----------------------------------------------------------------------------

[[menus.main]]
name = 'Home'
pageRef = '/'
weight = 10

[[menus.main]]
name = 'Posts'
pageRef = '/posts'
weight = 20

[[menus.main]]
name = 'Tags'
pageRef = '/tags'
weight = 30

# -----------------------------------------------------------------------------
# Modules
# -----------------------------------------------------------------------------

[module.hugoVersion]
min = '0.147.3'

[[module.imports]]
path = 'github.com/jmooring/hugo-module-archive'

# -----------------------------------------------------------------------------
# Pagination
# -----------------------------------------------------------------------------

[pagination]
pagerSize = 5

# -----------------------------------------------------------------------------
# Params
# -----------------------------------------------------------------------------

[params.modules.archive]
enableDaily = true    # Whether to enable daily archive pages.
navigation = false    # Whether to display previous and next buttons on archive pages.
paginate = true       # Whether to paginate archive pages.
prefix = '/archive/'  # The URL prefix for archive pages.
section = '/posts/'   # The section for which to build archive pages.

[params.modules.archive.formats]
year = "2006"
month = "January 2006"
day = "2 January 2006"

# -----------------------------------------------------------------------------
# Permalinks
# -----------------------------------------------------------------------------

[permalinks.page]
posts = "/:year/:month/:day/:slug"

# -----------------------------------------------------------------------------
# Render hooks
# -----------------------------------------------------------------------------

[markup.goldmark.renderHooks.image]
enableDefault = true

[markup.goldmark.renderHooks.link]
enableDefault = true
