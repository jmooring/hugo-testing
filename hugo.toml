baseURL = 'https://example.org/'
locale  = 'en-US'
title   = 'Hugo GitHub Issue #15238'

disableKinds = ['rss', 'sitemap', 'taxonomy', 'term']

[related]
  includeNewer = true
  threshold    = 80
  [[related.indices]]
    toLower        = true
    name           = "title"
    weight         = 100
    tokenize       = true
    minTokenLength = 4
