baseURL = 'https://example.org/'
languageCode = 'en-US'
title = 'Hugo GitHub Issue #8077'

# This is required until https://github.com/gohugoio/hugo/issues/13351 is fixed.
defaultOutputFormat = 'html'

[module.hugoVersion]
min = '0.146.7'

[[module.imports]]
path = 'github.com/jmooring/hugo-module-backlinks'

[markup.goldmark.renderHooks.link]
enableDefault = true

[outputs]
home = ['html','rss','backlinks']

[[menus.main]]
name = 'Home'
pageRef = '/'
weight = 10

[[menus.main]]
name = 'Posts'
pageRef = '/posts'
weight = 20
