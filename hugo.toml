baseURL = 'https://example.org/'
languageCode = 'en-US'
title = 'Hugo GitHub Issue #13711'

disableKinds = ['rss','sitemap','taxonomy','term']

defaultContentLanguage = 'en'
defaultContentLanguageInSubdir = true

[languages.en]
contentDir = 'content/en'
languageCode = 'en-US'
languageDirection = 'ltr'
languageName = 'English'
weight = 1

[languages.de]
contentDir = 'content/de'
languageCode = 'de-DE'
languageDirection = 'ltr'
languageName = 'Deutsch'
weight = 2

[segments]
  [segments.single_lang_en]
    [[segments.single_lang_en.includes]]
      lang = 'en'
    [[segments.single_lang_en.excludes]]
      path = '{/users,/users/**,/examples,/examples/**}'
