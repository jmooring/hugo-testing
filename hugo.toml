baseURL = 'https://example.org/'
locale  = 'en-US'
title   = 'Hugo GitHub Issue #8077'

[module.hugoVersion]
  min = '0.165.0'

[[module.imports]]
  path = 'github.com/jmooring/hugo-module-backlinks'

[markup.goldmark.renderHooks.link]
  useEmbedded = 'always'

[outputs]
  home = ['html', 'rss', 'backlinks']

[[menus.main]]
  name    = 'Home'
  pageRef = '/'
  weight  = 10

[[menus.main]]
  name    = 'Posts'
  pageRef = '/posts'
  weight  = 20
