baseURL = 'https://example.org/'
disableKinds = ['home','rss','sitemap','section','taxonomy','term']

defaultContentLanguage = 'en'
defaultContentLanguageInSubdir = true

[languages.en]
weight = 1

[languages.fr]
weight = 2

[[module.mounts]]
source = 'content/en'
target = 'content'
lang = 'en'

[[module.mounts]]
source = 'content/en'
target = 'content'
lang = 'fr'
