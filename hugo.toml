baseURL = 'https://example.org/'
title   = 'Hugo GitHub Issue #14759'

disableKinds = ['rss', 'sitemap', 'taxonomy', 'term']

defaultContentLanguage         = 'en'
defaultContentLanguageInSubdir = true

# -----------------------------------------------------------------------------
# Cascade
# -----------------------------------------------------------------------------

[cascade]
  [cascade.params]
    color = 'red'
  [cascade.target]
    path = '{/articles,/articles/**}'
    [cascade.target.sites]
      [cascade.target.sites.matrix]
        languages = '{de}'

# -----------------------------------------------------------------------------
# Languages: de
# -----------------------------------------------------------------------------

[languages.de]
  locale = 'de-DE'
  name   = 'Deutsch'
  weight = 1
  title  = 'Hugo GitHub Issue #14759 (de)'

  # [languages.de.permalinks]
  #   [languages.de.permalinks.page]
  #     articles = '/artikel/:year/:month/:slug/'
  #   [languages.de.permalinks.section]
  #     articles = '/artikel/'

  [[languages.de.menu.main]]
    name    = "Home"
    pageRef = "/"
    weight  = 1

  [[languages.de.menu.main]]
    name    = "Posts"
    pageRef = "/posts/"
    weight  = 2

  [[languages.de.menu.main]]
    name    = "Tutorials"
    pageRef = "/tutorials/"
    weight  = 2

# -----------------------------------------------------------------------------
# Languages: en
# -----------------------------------------------------------------------------

[languages.en]
  locale = 'en-US'
  name   = 'English'
  weight = 2
  title  = 'Hugo GitHub Issue #14759 (en)'

  # [languages.en.permalinks]
  #   [languages.en.permalinks.page]
  #     articles = '/blog/:year/:month/:slug/'
  #   [languages.en.permalinks.section]
  #     articles = '/blog/'

  [[languages.en.menu.main]]
    name    = "Home"
    pageRef = "/"
    weight  = 1

  [[languages.en.menu.main]]
    name    = "Articles"
    pageRef = "/articles/"
    weight  = 2

  [[languages.en.menu.main]]
    name    = "Tutorials"
    pageRef = "/tutorials/"
    weight  = 2

# -----------------------------------------------------------------------------
# Permalinks
# -----------------------------------------------------------------------------

[[permalinks]]
  pattern = '/artikel/'
  [permalinks.target]
    path = '{/articles}'
    [permalinks.target.sites]
      [permalinks.target.sites.matrix]
        languages = ['de']
[[permalinks]]
  pattern = '/artikel/:year/:month/:slug/'
  [permalinks.target]
    path = '{/articles/**}'
    [permalinks.target.sites]
      [permalinks.target.sites.matrix]
        languages = ['de']
[[permalinks]]
  pattern = '/blog/'
  [permalinks.target]
    path = '{/articles}'
    [permalinks.target.sites]
      [permalinks.target.sites.matrix]
        languages = ['en']
[[permalinks]]
  pattern = '/blog/:year/:month/:slug/'
  [permalinks.target]
    path = '{/articles/**}'
    [permalinks.target.sites]
      [permalinks.target.sites.matrix]
        languages = ['en']
